<figure class="tut-figure">
  <div class="tut-shot is-panel">
    <span class="tut-ring" style="--tut-x: 211px; --tut-y: 45px; --tut-w: 72px"></span>
    <span class="tut-mark" style="--tut-x: 211px; --tut-y: 65px">1</span>
    <span class="tut-ring" style="--tut-x: 124px; --tut-y: 134px; --tut-w: 240px"></span>
    <span class="tut-mark" style="--tut-x: 200px; --tut-y: 114px">2</span>

    <div class="sidebar">
      <div class="panel-title">
        <span class="z-label">Source control</span>
        <button class="z-icon-button" title="Refresh"><svg class="z-icon"><use href="#i-refresh-cw"></use></svg></button>
      </div>

      <div class="projectBanner">
        <span class="pathTrail"><svg class="z-icon z-icon-sm"><use href="#i-git-branch"></use></svg> main</span>
        <span class="buttons">
          <button class="z-icon-button on-chrome" title="Fetch"><svg class="z-icon"><use href="#i-cloud-download"></use></svg></button>
          <button class="z-icon-button on-chrome" title="Pull"><svg class="z-icon"><use href="#i-arrow-down"></use></svg></button>
          <button class="z-icon-button on-chrome" title="Push"><svg class="z-icon"><use href="#i-arrow-up"></use></svg></button>
        </span>
      </div>

      <div class="panel-section-toggle">
        <span class="panel-section-title">Staged</span>
        <span class="panel-section-count">1</span>
      </div>
      <div class="panel-row">
        <span class="file-mark file-mark-python">py</span>
        <span class="panel-row-name">prepare.py</span>
        <span class="panel-row-flag flag-added">A</span>
      </div>

      <div class="panel-section-toggle">
        <span class="panel-section-title">Changes</span>
        <span class="panel-section-count">1</span>
      </div>
      <div class="panel-row is-active">
        <span class="file-mark file-mark-json">{ }</span>
        <span class="panel-row-name">params.json</span>
        <span class="panel-row-flag flag-modified">M</span>
      </div>

      <div class="panel-section-toggle">
        <span class="panel-section-title">History</span>
        <span class="panel-section-count">36</span>
      </div>
    </div>
  </div>
  <ul class="tut-legend">
    <li><span class="tut-mark is-inline">1</span><span>The branch, with fetch, pull and push beside it.</span></li>
    <li><span class="tut-mark is-inline">2</span><span>A changed file. <code>M</code> is modified, <code>A</code> added — press the row to read the diff.</span></li>
  </ul>
</figure>
