<figure class="tut-figure">
  <div class="tut-shot is-strip">
    <span class="tut-ring" style="--tut-x: 169px; --tut-y: 41px"></span>
    <span class="tut-mark" style="--tut-x: 169px; --tut-y: 13px">1</span>
    <span class="tut-ring" style="--tut-x: 324px; --tut-y: 41px; --tut-w: 114px"></span>
    <span class="tut-mark" style="--tut-x: 324px; --tut-y: 13px">2</span>
    <span class="tut-ring is-right" style="--tut-x: 85px; --tut-y: 41px; --tut-w: 162px"></span>
    <span class="tut-mark is-right" style="--tut-x: 85px; --tut-y: 13px">3</span>

    <div class="text-editor-tool">
      <button class="z-icon-button" title="Save"><svg class="z-icon"><use href="#i-save"></use></svg></button>
      <span class="sep"></span>
      <button class="z-icon-button" title="Insert a cell below"><svg class="z-icon"><use href="#i-plus"></use></svg></button>
      <button class="z-icon-button" title="Cut the cell"><svg class="z-icon"><use href="#i-scissors"></use></svg></button>
      <button class="z-icon-button" title="Copy the cell"><svg class="z-icon"><use href="#i-copy"></use></svg></button>
      <button class="z-icon-button" title="Paste below"><svg class="z-icon"><use href="#i-clipboard-paste"></use></svg></button>
      <span class="sep"></span>
      <button class="z-icon-button" title="Run and advance"><svg class="z-icon"><use href="#i-play"></use></svg></button>
      <button class="z-icon-button" title="Interrupt"><svg class="z-icon"><use href="#i-square"></use></svg></button>
      <button class="z-icon-button" title="Restart"><svg class="z-icon"><use href="#i-rotate-cw"></use></svg></button>
      <button class="z-icon-button" title="Run all below"><svg class="z-icon"><use href="#i-fast-forward"></use></svg></button>
      <span class="sep"></span>
      <div class="z-select editor-select">
        <select aria-label="Cell type" disabled>
          <option>Code</option>
        </select>
      </div>
      <span class="kernel-pill">
        <span class="kernelStatus ks-idle" title="Idle"></span>
        Python 3 (ipykernel)
      </span>
    </div>
  </div>
  <ul class="tut-legend">
    <li><span class="tut-mark is-inline">1</span><span>Run the cell you are in and move to the next one.</span></li>
    <li><span class="tut-mark is-inline">2</span><span>What kind of cell this is: code, prose, or raw text left alone.</span></li>
    <li><span class="tut-mark is-inline">3</span><span>The kernel, and whether it is busy. Click it to switch.</span></li>
  </ul>
</figure>
