<figure class="tut-figure">
  <div class="tut-shot has-menu">
    <div class="text-editor-tool">
      <button class="z-icon-button" title="Save"><svg class="z-icon"><use href="#i-save"></use></svg></button>
      <span class="sep"></span>
      <button class="z-icon-button" title="Run and advance"><svg class="z-icon"><use href="#i-play"></use></svg></button>
      <button class="z-icon-button" title="Interrupt"><svg class="z-icon"><use href="#i-square"></use></svg></button>
      <button class="z-icon-button" title="Restart"><svg class="z-icon"><use href="#i-rotate-cw"></use></svg></button>
      <span class="sep"></span>
      <div class="z-select editor-select">
        <select aria-label="Cell type" disabled><option>Code</option></select>
      </div>
      <span class="kernel-pill">
        <span class="kernelStatus ks-idle" title="Idle"></span>
        Python 3 (ipykernel)
      </span>

      <span class="sep"></span>
      <span class="export-anchor">
        <button class="z-icon-button" title="Export" aria-haspopup="menu" aria-expanded="true">
          <svg class="z-icon"><use href="#i-download"></use></svg>
        </button>
        <div class="z-overlay z-menu export-menu-mock">
          <div class="z-overlay-list">
            <div class="z-overlay-group"><span class="z-label">Export as</span></div>
            <div class="panel-row"><span class="panel-row-name">HTML page…</span></div>
            <div class="panel-row"><span class="panel-row-name">Markdown</span></div>
            <div class="panel-row"><span class="panel-row-name">Script</span></div>
          </div>
        </div>
      </span>
    </div>
  </div>
  <figcaption class="tut-caption">The export button sits past the kernel, at the end of the toolbar.</figcaption>
</figure>
