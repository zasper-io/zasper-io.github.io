<!--
The top nav, on every page. Used to be two nearly-identical copies (header.html's and header2.html's)
because the home page's hero used to be drawn as part of the same <section> as the nav — that coupling
is gone, so there is one nav, used everywhere, that opens and closes nothing but itself.

`is-current` compares `page.url` against each link's own href with the trailing slash Jekyll adds to
`/docs`-style permalinks normalised off, so the highlight survives being on `/docs/installation` and
not just `/docs` itself.
-->
{% assign path = page.url | remove_first: '/' | split: '/' | first %}
<header>
  <nav class="mk-nav" id="site-nav">
    <a class="mk-nav-logo" href="/">
      <img src="/static/images/logo.svg" alt="Zasper" />
    </a>

    <button
      type="button"
      class="mk-nav-toggle"
      id="nav-toggle"
      aria-label="Menu"
      aria-expanded="false"
      aria-controls="nav-links"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="12" y2="12" /><line x1="4" x2="20" y1="6" y2="6" /><line x1="4" x2="20" y1="18" y2="18" /></svg>
    </button>

    <div class="mk-nav-links" id="nav-links">
      <a href="/docs" {% if path == 'docs' %}class="is-current" aria-current="page"{% endif %}>Docs</a>
      <a href="/blog" {% if path == 'blog' %}class="is-current" aria-current="page"{% endif %}>Blog</a>
      <!-- <a href="/tutorials" {% if path == 'tutorials' %}class="is-current" aria-current="page"{% endif %}>Tutorials</a> -->
      <a href="/downloads" {% if path == 'downloads' %}class="is-current" aria-current="page"{% endif %}>Downloads</a>
      <a class="mk-nav-github" href="https://github.com/zasper-io/zasper" target="_blank" aria-label="GitHub">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4" /><path d="M9 18c-4.51 2-5-2-7-2" /></svg>
      </a>
    </div>
  </nav>
</header>
