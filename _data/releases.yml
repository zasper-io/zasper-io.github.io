# Every release, newest first, for /changelog/. A release adds an entry at the top, written from that
# version's section of CHANGELOG.md in zasper-io/zasper. The first entry is the one marked Latest.
#
# `upgrading`, `highlights` and `changes` are lists of Markdown. `shot` is for a release worth showing
# and is left out otherwise.

- version: "2.2.0"
  date: 2026-11-12
  summary: >-
    Zasper from the keyboard alone and with a screen reader: F6 moves between the window's parts, every
    menu, dialog, tab strip and grid has its keyboard, and cells say what they hold and when they
    finish. Zasper can also be served under a path behind a hub, kernel outputs' scripts run in a
    sandbox rather than in the page, and Antigravity CLI takes Gemini CLI's place in the agent panel.
  upgrading_from: "2.1.0"
  upgrading:
    - "Gemini CLI is no longer listed in the agent panel; Antigravity CLI takes its place. Gemini CLI still starts by its command line, `gemini --experimental-acp`."
    - HTML and SVG output that runs scripts runs them in a sandboxed frame, with no access to Zasper's page. Output with nothing to run is drawn as before.
    - A Python kernel is reached through Unix sockets on macOS and Linux. Other kernels, and Windows, keep TCP.
    - Building from source needs Go 1.26.10 or later.
  highlights:
    - "**The keyboard alone, and screen readers**: `F6` between the window's parts, every menu, dialog and tab strip by keyboard, and cells that say what they hold and when they finish."
    - "**`--base-url`** serves Zasper under a path, such as a hub's `/user/<name>/`."
    - "**Outputs' scripts in a sandbox**, and Bokeh's `show()` in the notebook."
    - "**Antigravity CLI** in the agent panel, and tabs you reorder by dragging."
  changes:
    added:
      - "`F6` and `Shift+F6` move between the window's parts, and out of a terminal or an editor."
      - Menus, dialogs, the command palette, the tab strip, the file tree and the data grid work from the keyboard.
      - Cells, editors and the window are named after what they hold, and a cell finishing or failing, the kernel's state, saves and an agent's replies are announced.
      - A screen reader mode for the terminal, in Settings.
      - One focus ring on every surface, and selection, state and dialogs that stay visible under forced colours.
      - "`--base-url` and `ZASPER_BASE_URL`, to serve Zasper under a path."
      - "Bokeh's `output_notebook()` and `show()`."
      - Reorder tabs by dragging; the strip scrolls with a mouse wheel and keeps the front tab in view.
      - SQL connections are added, edited and removed in the Data panel.
      - "`Shift+O` in command mode expands or collapses a cell's output."
    changed:
      - An output's scripts run in a sandboxed frame rather than in the page.
      - A Python kernel is reached through Unix sockets on macOS and Linux.
      - Antigravity CLI replaces Gemini CLI in the agent panel, and Codex's adapter is `@agentclientprotocol/codex-acp`.
    fixed:
      - "A SQL connection's password pasted as part of its URL goes to the keychain, not `connections.json`."
      - "`input()`'s reply box is labelled with its prompt, and `getpass()` is masked."
      - Text, field edges and git colours meet WCAG AA contrast; prose links are underlined.
      - The active cell is marked by its left edge, its output included.
      - Dollar amounts in an agent's answer are shown as money, not maths.
      - "Security updates for dompurify, sanitize-html, vite, klauspost/compress, andybalholm/brotli and the Go toolchain."

- version: "2.1.0"
  date: 2026-10-16
  summary: >-
    Coding agents in Zasper. The agent you already use, Claude Code, Gemini CLI or Codex, works in a
    panel beside your notebooks, reads, edits and runs them through Zasper's own tools, and every change
    it makes can be reviewed and undone. A notebook now takes changes made to its file while it is open,
    cell by cell, and there is a variables panel, SQL cells, a notebook diff, and folders that run
    nothing until you trust them.
  upgrading_from: "2.0.0"
  upgrading:
    - "A folder runs nothing until you trust it. Zasper asks once per folder; `zasper --trust` trusts it for one run."
    - "The watch socket sends `{\"changed\": [...]}` where it sent `reload`. A script should treat any message as a change."
    - "`PUT /api/contents` answers `409` when it is given a `hash` and the file has changed since. A save without a `hash` writes as before."
  shot:
    image: /static/images/changelog/agent-panel.png
    label: Coding agents
    alt: A penguins notebook open in Zasper with the scatter plot Claude Code added, and its panel beside it listing the tools it called, its answer, and the file its turn changed
    caption: "**Claude Code in the agent panel**, after adding and running a chart cell: its answer beside the chart, and the file its turn changed, ready to review or undo."
  highlights:
    - "**Coding agents** in a panel on the right: Claude Code, Gemini CLI, Codex or any ACP agent, with Zasper's tools for notebooks and kernels."
    - "**Review and undo** what each turn changed: a block, a cell, a file or the whole turn."
    - "**A notebook that keeps up** with changes made to its file, cell by cell, and with runs started anywhere."
    - "**A variables panel**, DataFrames as a grid that becomes a chart, and **SQL cells**."
  changes:
    added:
      - "The agent panel: start an agent, mention files, cells and outputs, choose what it may do without asking, and open past conversations again."
      - "Zasper's MCP server, for agents in the panel and, through `zasper mcp`, for any agent in a terminal."
      - A command an agent runs shows its output and exit code in its row.
      - A notebook takes a change made to its file while it is open, cell by cell, and asks only about a cell both sides changed.
      - A run started from another tab, an agent, or with no tab open reaches its cell, and its output is kept for a tab that opens later.
      - A notebook diff, cell by cell, with outputs and metadata.
      - A variables panel, a data grid for DataFrames, and charts made from it, kept as the code that draws them.
      - SQL cells on connections Zasper manages.
      - Each kernel's memory and GPU memory.
      - Run time beside each cell.
      - "`text/markdown`, GIF, WebP and PDF outputs."
      - Kernels in any conda environment, and language servers for Java, Scala, Kotlin, C#, shell, SQL and Haskell.
      - A notebook naming no kernel starts one for the language it is written in.
      - What's new, as a tab after an upgrade.
    changed:
      - Usage data counts the new features, by kind and in buckets, never by name or content.
      - The status bar takes the theme's hue in dark themes.
      - More room between cells, and Shift-Enter keeps the next cell in view.
    fixed:
      - A notebook's kernel no longer imports modules that sit beside the notebook as it starts.
      - Run All no longer sends a cell before the SQL cell above it has finished.
      - A kernel slow to start is waited for however long it takes.
      - A dead kernel says why, with the last lines it printed.
      - "On Windows, interrupting a kernel works, and stopping one stops everything it started."
      - C and C++ notebooks no longer get errors from clangd.

- version: "2.0.0"
  date: 2026-09-22
  major: true
  summary: >-
    Language servers, search across the project, and a terminal panel under the editor. It is a major
    release because two parts of the documented API changed incompatibly, both as part of moving the
    browser's session into an `HttpOnly` cookie. The app upgrades without any action.
  upgrading_from: "1.1.0"
  upgrading:
    - "WebSocket routes no longer accept `?token=<jwt>`. Send `Authorization: Bearer <jwt>` on the upgrade instead."
    - "`protected` is no longer in `/api/config` or `/api/info`. Treat a missing field as `true`."
    - You will be asked to sign in once.
    - A notebook's kernel starts in the notebook's folder, as in Jupyter.
    - HTML outputs saved in a notebook no longer run their scripts when it opens. Re-run the cell to bring back an interactive plot.
    - "A server bound to `127.0.0.1` or `localhost` answers only to a localhost address. Name a reverse proxy's host with `--allow-host` or `ZASPER_ALLOWED_HOSTS`."
    - Request bodies are capped, at 512 MiB for the API (uploads excepted) and 16 KiB for sign-in.
  shot:
    image: /static/images/changelog/terminal-panel.png
    label: Terminal panel
    alt: A notebook open in Zasper, with a terminal panel beneath it running a Python session
    caption: "**A terminal panel below the editor**, so a shell and the code it runs against are on screen together."
  highlights:
    - "**Language servers** for Python, Go, JavaScript and TypeScript, Rust, C and C++, R and Julia, in files and in notebooks."
    - "**Search across the project**, with replace and a preview."
    - "**Find and replace in a notebook**, across cells and outputs."
    - "**Export a notebook** as an HTML page, Markdown or a script."
  changes:
    added:
      - "`--allow-host` and `ZASPER_ALLOWED_HOSTS`, for serving Zasper behind a reverse proxy."
      - "Language servers: diagnostics, completion, hover, go to definition, references, rename, symbols, inlay hints and format on save."
      - Search across the project, with replace and the matches in unsaved editors included.
      - Find and replace in a notebook, across cells and outputs.
      - Export a notebook as an HTML page, Markdown or a script.
      - A table of contents beside a notebook's cells.
      - Command and edit modes in notebooks, with Jupyter's keys.
      - Choose a Python interpreter, and run a Python file in the terminal with it.
      - A terminal panel below the editor.
      - "Editor settings, and `.editorconfig` files are honoured."
      - The status bar shows and changes a file's language, indentation and line endings.
      - Go to line and recent files in the command palette.
      - A file changed on disk updates its editor, and your unsaved edits are kept.
      - A Settings switch for loading widget libraries from the CDN.
      - A notice when your session ends or the server stops.
      - The startup banner is in colour.
    changed:
      - Stopping a kernel asks it to shut down instead of killing it.
      - A kernel accepts more than one connection at a time.
      - Switching themes no longer animates every colour on the page.
      - Terminals are no longer offered on Windows, where they have never worked.
    fixed:
      - A kernel that failed to start left its connection file behind.
      - Saving a file reset its permissions.
      - Saving a file that is a link replaced the link with a plain file.
      - A delete request naming the project folder itself was not refused.
      - "On Windows, language servers in a project's `.venv` were not found."
      - "Notebooks with Plotly, Vega or other `application/*+json` outputs were reported as not matching nbformat's schema."

- version: "1.1.0"
  date: 2026-09-14
  summary: "Sign-in, tightened: every server requires the access token, and opens signed in."
  upgrading_from: "1.0.0"
  upgrading:
    - Every server now requires the access token.
    - "`ZASPER_JWT_SECRET` has been removed. Set `ZASPER_ACCESS_TOKEN` to a fixed token instead."
    - Zasper opens your browser on startup, already signed in. Pass `--no-browser` to turn it off.
  highlights:
    - "`ZASPER_ACCESS_TOKEN`, to fix the access token."
    - A sign-in link in the startup banner.
    - Setting up a Python kernel from the Launcher.

- version: "1.0.0"
  date: 2026-09-10
  summary: >-
    The first stable release. Zasper's HTTP and WebSocket API, its configuration file and its
    command-line flags are covered by semantic versioning from here on: they will not break within 1.x.
  upgrading_from: "0.2.0-beta"
  upgrading:
    - "The server binds `127.0.0.1` by default. To reach it from another machine, start it with `--host=0.0.0.0` and `--protected=true`."
    - "`DELETE /ws/kernels/{kernel_id}` has been removed. Call `DELETE /api/kernels/{kernelId}` instead."
    - "Kernel connection files moved from the system temp directory to `~/.zasper/runtime`."
  shot:
    image: /static/images/changelog/source-control.png
    label: Source control
    alt: The source control panel listing three changed files, beside a side-by-side diff of one of them
    caption: "**Source control.** Staging, commits, branches, history and side-by-side diffs, without leaving the notebook."
  highlights:
    - "**Notebook outputs:** ipywidgets, Plotly, tables and LaTeX."
    - "**A command palette** for files and commands."
    - "**Nine themes** from one set of design tokens."

